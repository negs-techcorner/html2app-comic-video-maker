name: Build Signed Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor & Asset Tools
        run: |
          npm install --no-audit --no-fund

      - name: Initialize Android Platform & Generate Adaptive Icons
        run: |
          rm -rf android
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#FFFFFF' || true
          node -e '
            const fs = require("fs");
            const path = require("path");
            const { execSync } = require("child_process");

            // Ensure multi-density mipmap icons & adaptive XML override Capacitor defaults
            const resDir = "android/app/src/main/res";
            const densities = [
              { name: "mipmap-mdpi", size: 48, fg: 108 },
              { name: "mipmap-hdpi", size: 72, fg: 162 },
              { name: "mipmap-xhdpi", size: 96, fg: 216 },
              { name: "mipmap-xxhdpi", size: 144, fg: 324 },
              { name: "mipmap-xxxhdpi", size: 192, fg: 432 }
            ];

            for (const d of densities) {
              const dir = path.join(resDir, d.name);
              fs.mkdirSync(dir, { recursive: true });
              try {
                execSync(`convert assets/icon-only.png -resize ${d.size}x${d.size} ${path.join(dir, "ic_launcher.png")}`);
                execSync(`convert assets/icon-only.png -resize ${d.size}x${d.size} ${path.join(dir, "ic_launcher_round.png")}`);
                const inner = Math.round(d.fg * 0.66);
                execSync(`convert assets/icon-foreground.png -resize ${inner}x${inner} -background none -gravity center -extent ${d.fg}x${d.fg} ${path.join(dir, "ic_launcher_foreground.png")}`);
              } catch (e) {}
            }

            const anydpiDir = path.join(resDir, "mipmap-anydpi-v26");
            fs.mkdirSync(anydpiDir, { recursive: true });
            const adaptiveXml = `<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@color/ic_launcher_background"/>
    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
</adaptive-icon>`;
            fs.writeFileSync(path.join(anydpiDir, "ic_launcher.xml"), adaptiveXml);
            fs.writeFileSync(path.join(anydpiDir, "ic_launcher_round.xml"), adaptiveXml);

            const valuesDir = path.join(resDir, "values");
            fs.mkdirSync(valuesDir, { recursive: true });
            const bgColorXml = `<?xml version="1.0" encoding="utf-8"?>
<resources>
    <color name="ic_launcher_background">#FFFFFF</color>
</resources>`;
            fs.writeFileSync(path.join(valuesDir, "ic_launcher_background.xml"), bgColorXml);

            // Configure versionCode, versionName, orientation & fullscreen
            const gradlePath = "android/app/build.gradle";
            if (fs.existsSync(gradlePath)) {
              let gradle = fs.readFileSync(gradlePath, "utf8");
              gradle = gradle.replace(/versionCode\s+\d+/, "versionCode 1");
              gradle = gradle.replace(/versionName\s+"[^"]+"/, "versionName \"1.0.0\"");
              fs.writeFileSync(gradlePath, gradle);
            }

            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(manifestPath)) {
              let manifest = fs.readFileSync(manifestPath, "utf8");
              const orientAttr = "portrait" === "auto" ? "" : ` android:screenOrientation="portrait"`;
              const themeAttr = true ? ` android:theme="@android:style/Theme.NoTitleBar.Fullscreen"` : "";
              manifest = manifest.replace(/<activity([^>]*android:name="\.MainActivity"[^>]*)>/, (m, attrs) => {
                let cleaned = attrs.replace(/\s*android:screenOrientation="[^"]*"/g, "");
                if (true) cleaned = cleaned.replace(/\s*android:theme="[^"]*"/g, "");
                return `<activity${cleaned}${orientAttr}${themeAttr}>`;
              });
              fs.writeFileSync(manifestPath, manifest);
            }
          '
          npx cap sync android

      - name: Compile Release APK & Sign with Keystore
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cd ..
          keytool -genkey -v -keystore release-key.jks -alias html2app -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=Comic Video Maker, OU=Mobile, O=TechCorner, L=Jakarta, S=JK, C=ID"
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          $BUILD_TOOLS/zipalign -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk app-aligned.apk
          $BUILD_TOOLS/apksigner sign --ks release-key.jks --ks-pass pass:android123 --key-pass pass:android123 --out comic-video-maker-v1.0.0.apk app-aligned.apk
          $BUILD_TOOLS/apksigner verify comic-video-maker-v1.0.0.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "Comic Video Maker v1.0.0 (Build #${{ github.run_number }})"
          body: "Signed Android APK compiled automatically by HTML2App Studio."
          files: comic-video-maker-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
