name: Build Signed Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor Dependencies
        run: npm install

      - name: Add Android Native Platform
        run: npx cap add android

      - name: Generate Android Adaptive & Legacy Launcher Icons
        run: |
          npm install -D @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor "#FFFFFF" --iconBackgroundColorDark "#FFFFFF"

          python3 -m pip install --quiet pillow
          python3 - << 'EOF'
          import os
          from PIL import Image, ImageDraw

          src_path = "assets/icon-only.png"
          res_dir = "android/app/src/main/res"
          bg_hex = "#FFFFFF"

          if os.path.exists(src_path):
              src = Image.open(src_path).convert("RGBA")

              r = int(bg_hex[1:3], 16)
              g = int(bg_hex[3:5], 16)
              b = int(bg_hex[5:7], 16)

              densities = {
                  "mipmap-mdpi": (48, 108),
                  "mipmap-hdpi": (72, 162),
                  "mipmap-xhdpi": (96, 216),
                  "mipmap-xxhdpi": (144, 324),
                  "mipmap-xxxhdpi": (192, 432),
              }

              for folder, (legacy_px, fg_px) in densities.items():
                  out_dir = os.path.join(res_dir, folder)
                  os.makedirs(out_dir, exist_ok=True)

                  # 1. Legacy square launcher icon composited on background color
                  bg_sq = Image.new("RGBA", (legacy_px, legacy_px), (r, g, b, 255))
                  resized_sq = src.resize((legacy_px, legacy_px), Image.Resampling.LANCZOS)
                  bg_sq.alpha_composite(resized_sq)
                  bg_sq.save(os.path.join(out_dir, "ic_launcher.png"), "PNG")

                  # 2. Legacy round launcher icon with circular alpha mask
                  mask = Image.new("L", (legacy_px, legacy_px), 0)
                  draw = ImageDraw.Draw(mask)
                  draw.ellipse((0, 0, legacy_px - 1, legacy_px - 1), fill=255)
                  round_icon = Image.new("RGBA", (legacy_px, legacy_px), (0, 0, 0, 0))
                  round_icon.paste(bg_sq, (0, 0), mask)
                  round_icon.save(os.path.join(out_dir, "ic_launcher_round.png"), "PNG")

                  # 3. Android 8.0+ Adaptive Icon foreground (108dp canvas, 66% safe-zone inner icon)
                  fg_canvas = Image.new("RGBA", (fg_px, fg_px), (0, 0, 0, 0))
                  inner_px = int(round(fg_px * 0.66))
                  offset = (fg_px - inner_px) // 2
                  resized_fg = src.resize((inner_px, inner_px), Image.Resampling.LANCZOS)
                  fg_canvas.alpha_composite(resized_fg, (offset, offset))
                  fg_canvas.save(os.path.join(out_dir, "ic_launcher_foreground.png"), "PNG")

              # 4. Ensure values/ic_launcher_background.xml matches chosen background color
              values_dir = os.path.join(res_dir, "values")
              os.makedirs(values_dir, exist_ok=True)
              with open(os.path.join(values_dir, "ic_launcher_background.xml"), "w", encoding="utf-8") as f:
                  f.write(f'''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">{bg_hex}</color>
          </resources>
          ''')

              # 5. Ensure mipmap-anydpi-v26 adaptive XMLs point to color background + foreground
              anydpi_dir = os.path.join(res_dir, "mipmap-anydpi-v26")
              os.makedirs(anydpi_dir, exist_ok=True)
              adaptive_xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          '''
              for xml_name in ("ic_launcher.xml", "ic_launcher_round.xml"):
                  with open(os.path.join(anydpi_dir, xml_name), "w", encoding="utf-8") as f:
                      f.write(adaptive_xml)
          EOF

      - name: Sync Web Assets to Android
        run: npx cap sync android

      - name: Apply App Version (1.0.0 / 1)
        run: |
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/versionCode [0-9]*/versionCode 1/g' "$GRADLE_FILE"
            sed -i 's/versionName "[^"]*"/versionName "1.0.0"/g' "$GRADLE_FILE"
          fi

      - name: Configure Screen Orientation (portrait)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's|android:name=".MainActivity"|android:name=".MainActivity" android:screenOrientation="portrait"|g' "$MANIFEST"
          fi

      - name: Build & Sign Android APK
        id: build_apk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease || ./gradlew assembleDebug
          cd ..

          mkdir -p release-out
          UNSIGNED_APK=$(find android/app/build/outputs/apk -name "*release-unsigned.apk" | head -n 1)
          DEBUG_APK=$(find android/app/build/outputs/apk -name "*debug.apk" | head -n 1)
          FINAL_APK="release-out/comic-video-maker-v1.0.0-b${{ github.run_number }}.apk"

          if [ -n "$UNSIGNED_APK" ]; then
            BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
            keytool -genkey -v -keystore release.keystore -alias appkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=HTML2App Studio, OU=Mobile, O=Studio, L=Cloud, S=CA, C=US"
            "$BUILD_TOOLS/zipalign" -v -p 4 "$UNSIGNED_APK" aligned.apk
            "$BUILD_TOOLS/apksigner" sign --ks release.keystore --ks-pass pass:android --key-pass pass:android --out "$FINAL_APK" aligned.apk
          elif [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "$FINAL_APK"
          else
            echo "No APK output found!" && exit 1
          fi

          echo "apk_path=$FINAL_APK" >> $GITHUB_OUTPUT
          ls -lh "$FINAL_APK"

      - name: Publish Signed APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0.${{ github.run_number }}
          name: Release v1.0.0 (Build ${{ github.run_number }})
          body: "Automated Android APK build generated by HTML2App Studio."
          files: ${{ steps.build_apk.outputs.apk_path }}
